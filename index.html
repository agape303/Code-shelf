<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9480f">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Code Shelf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, sticky search + topic chips, lesson rows with Watch / Save / Done actions. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --fg: #0f1b2d;
  --muted: #5a6b80;
  --line: #d5dde6;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --done: #2b8a3e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141c; --surface: #16202b; --fg: #e8eef5; --muted: #93a3b6;
    --line: #26343f; --accent: #ff8a4c; --accent-ink: #1a0d05; --done: #5fd07a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #16202b; --fg: #e8eef5; --muted: #93a3b6;
  --line: #26343f; --accent: #ff8a4c; --accent-ink: #1a0d05; --done: #5fd07a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--done); transition: width 0.3s; }
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; display: flex; flex-direction: column; gap: 10px; }
input[type="search"], input[type="text"], input[type="url"], select {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; min-height: 46px;
}
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font: inherit; font-weight: 500; font-size: 0.9rem; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 12px; }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lesson.is-done { opacity: 0.72; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tags .cat { color: var(--accent); }
.lesson h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.lesson p { margin: 0; color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 700; font-size: 0.9rem; min-height: 44px; padding: 0 16px; border-radius: 8px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  border: 1.5px solid var(--line); background: transparent; color: var(--fg);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--done); color: var(--done); }
.btn.del { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; border: 1.5px dashed var(--line); border-radius: 10px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
summary { font-family: var(--font-display); font-weight: 700; cursor: pointer; min-height: 32px; }
form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
label { font-size: 0.85rem; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.msg { font-size: 0.88rem; min-height: 1.2em; margin: 0; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<style>body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Code Shelf</h1>
    <p class="sub">Free coding lessons, sorted by topic. Tap Watch to open the lessons on YouTube.</p>
  </header>

  <section class="progress" aria-label="Your progress">
    <div class="progress-row"><span id="progLabel">0 of 0 done</span><span id="progPct">0%</span></div>
    <div class="bar"><i id="progBar"></i></div>
  </section>

  <div class="sticky">
    <input type="search" id="q" placeholder="Search lessons, e.g. flexbox, loops" aria-label="Search lessons" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="Topics"></div>
  </div>

  <main class="list" id="list" aria-live="polite"></main>

  <details id="addBox">
    <summary>Add your own video link</summary>
    <form id="addForm">
      <label for="addTitle">Title
        <input type="text" id="addTitle" maxlength="120" placeholder="e.g. JavaScript arrays explained" required>
      </label>
      <label for="addUrl">YouTube link
        <input type="url" id="addUrl" placeholder="https://www.youtube.com/watch?v=..." required>
      </label>
      <label for="addCat">Topic
        <select id="addCat"></select>
      </label>
      <button class="btn primary" type="submit">Add to my shelf</button>
      <p class="msg" id="addMsg" role="status"></p>
    </form>
    <p class="note">Saved lessons, done marks and your own links are kept in this browser on this phone.</p>
  </details>
</div>

<script>
(function () {
  var CATS = ["HTML", "CSS", "JavaScript", "Python", "Git", "Apps"];
  var BASE = [
    { t: "HTML basics: tags, links, images", ch: "freeCodeCamp", q: "freeCodeCamp HTML full course for beginners", c: "HTML", l: "Beginner" },
    { t: "Build your first web page", ch: "Traversy Media", q: "Traversy Media HTML crash course", c: "HTML", l: "Beginner" },
    { t: "HTML forms and inputs", ch: "Kevin Powell", q: "HTML forms tutorial for beginners", c: "HTML", l: "Beginner" },
    { t: "Semantic HTML and page structure", ch: "Web Dev Simplified", q: "Web Dev Simplified semantic HTML", c: "HTML", l: "Intermediate" },
    { t: "CSS from zero: selectors, colors, spacing", ch: "Kevin Powell", q: "Kevin Powell CSS for beginners", c: "CSS", l: "Beginner" },
    { t: "Flexbox in one sitting", ch: "Traversy Media", q: "CSS flexbox crash course", c: "CSS", l: "Beginner" },
    { t: "CSS Grid layouts", ch: "Kevin Powell", q: "CSS grid tutorial", c: "CSS", l: "Intermediate" },
    { t: "Make a site work on phones", ch: "freeCodeCamp", q: "responsive web design tutorial mobile first", c: "CSS", l: "Intermediate" },
    { t: "JavaScript for complete beginners", ch: "freeCodeCamp", q: "freeCodeCamp JavaScript full course for beginners", c: "JavaScript", l: "Beginner" },
    { t: "Variables, functions and loops", ch: "Programming with Mosh", q: "Programming with Mosh JavaScript tutorial", c: "JavaScript", l: "Beginner" },
    { t: "The DOM: change a page with code", ch: "Web Dev Simplified", q: "JavaScript DOM manipulation tutorial", c: "JavaScript", l: "Intermediate" },
    { t: "Fetch data from an API", ch: "Traversy Media", q: "JavaScript fetch API tutorial", c: "JavaScript", l: "Intermediate" },
    { t: "Python for beginners", ch: "freeCodeCamp", q: "freeCodeCamp Python full course for beginners", c: "Python", l: "Beginner" },
    { t: "Python basics in one video", ch: "Programming with Mosh", q: "Programming with Mosh Python tutorial for beginners", c: "Python", l: "Beginner" },
    { t: "Lists, dictionaries and files", ch: "Corey Schafer", q: "Corey Schafer Python tutorial dictionaries", c: "Python", l: "Intermediate" },
    { t: "Small Python projects to practise", ch: "Tech With Tim", q: "Tech With Tim Python beginner projects", c: "Python", l: "Intermediate" },
    { t: "What Git and GitHub are for", ch: "freeCodeCamp", q: "Git and GitHub for beginners crash course", c: "Git", l: "Beginner" },
    { t: "Commit, branch and merge", ch: "Programming with Mosh", q: "Git tutorial for beginners commit branch merge", c: "Git", l: "Beginner" },
    { t: "Put your first project on GitHub", ch: "Traversy Media", q: "how to upload project to GitHub for beginners", c: "Git", l: "Beginner" },
    { t: "Fix merge conflicts", ch: "Web Dev Simplified", q: "git merge conflicts tutorial", c: "Git", l: "Intermediate" },
    { t: "Build a mobile app with Flutter", ch: "freeCodeCamp", q: "freeCodeCamp Flutter course for beginners", c: "Apps", l: "Intermediate" },
    { t: "No-code apps with Glide", ch: "Glide", q: "Glide apps tutorial for beginners", c: "Apps", l: "Beginner" },
    { t: "React for beginners", ch: "Programming with Mosh", q: "React crash course for beginners", c: "Apps", l: "Intermediate" },
    { t: "Publish an app on Google Play", ch: "Android Developers", q: "how to publish app on Google Play Console", c: "Apps", l: "Intermediate" }
  ].map(function (x, i) {
    return { id: "b" + i, title: x.t, sub: "Try " + x.ch + " (opens a YouTube search)", cat: x.c, level: x.l,
      url: "https://www.youtube.com/results?search_query=" + encodeURIComponent(x.q), custom: false };
  });

  var KEY = "codeshelf.v1";
  var state = { saved: {}, done: {}, mine: [] };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); state.saved = p.saved || {}; state.done = p.done || {}; state.mine = p.mine || []; }
  } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var cat = "All", query = "";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function all() { return state.mine.concat(BASE); }

  function renderChips() {
    var names = ["All", "Saved"].concat(CATS);
    $("chips").innerHTML = names.map(function (n) {
      return '<button class="chip" type="button" data-cat="' + n + '" aria-pressed="' + (n === cat) + '">' + n + "</button>";
    }).join("");
  }

  function renderProgress() {
    var items = all(), d = items.filter(function (i) { return state.done[i.id]; }).length;
    var pct = items.length ? Math.round(d / items.length * 100) : 0;
    $("progLabel").textContent = d + " of " + items.length + " done";
    $("progPct").textContent = pct + "%";
    $("progBar").style.width = pct + "%";
  }

  function renderList() {
    var q = query.trim().toLowerCase();
    var items = all().filter(function (i) {
      if (cat === "Saved" && !state.saved[i.id]) return false;
      if (cat !== "All" && cat !== "Saved" && i.cat !== cat) return false;
      return !q || (i.title + " " + i.sub + " " + i.cat + " " + i.level).toLowerCase().indexOf(q) > -1;
    });
    if (!items.length) {
      $("list").innerHTML = '<div class="empty">' + (cat === "Saved" ? "Nothing saved yet. Tap Save on a lesson to keep it here." : "No lessons match. Try another word or topic.") + "</div>";
      return;
    }
    $("list").innerHTML = items.map(function (i) {
      var s = !!state.saved[i.id], d = !!state.done[i.id];
      return '<article class="lesson' + (d ? " is-done" : "") + '">' +
        '<div class="tags"><span class="cat">' + esc(i.cat) + "</span><span>" + esc(i.level) + "</span>" + (i.custom ? "<span>Mine</span>" : "") + "</div>" +
        "<h2>" + esc(i.title) + "</h2><p>" + esc(i.sub) + "</p>" +
        '<div class="actions">' +
        '<a class="btn primary" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">Watch</a>' +
        '<button class="btn" type="button" data-act="save" data-id="' + i.id + '" aria-pressed="' + s + '">' + (s ? "Saved" : "Save") + "</button>" +
        '<button class="btn" type="button" data-act="done" data-id="' + i.id + '" aria-pressed="' + d + '">' + (d ? "Done" : "Mark done") + "</button>" +
        (i.custom ? '<button class="btn del" type="button" data-act="del" data-id="' + i.id + '">Remove</button>' : "") +
        "</div></article>";
    }).join("");
  }

  function renderAll() { renderChips(); renderProgress(); renderList(); }

  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]"); if (!b) return;
    cat = b.getAttribute("data-cat"); renderAll();
  });
  $("q").addEventListener("input", function (e) { query = e.target.value; renderList(); });
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = b.getAttribute("data-id"), act = b.getAttribute("data-act");
    if (act === "save") { state.saved[id] = !state.saved[id]; if (!state.saved[id]) delete state.saved[id]; }
    if (act === "done") { state.done[id] = !state.done[id]; if (!state.done[id]) delete state.done[id]; }
    if (act === "del") {
      state.mine = state.mine.filter(function (m) { return m.id !== id; });
      delete state.saved[id]; delete state.done[id];
    }
    persist(); renderProgress(); renderList();
  });

  $("addCat").innerHTML = CATS.map(function (c) { return '<option value="' + c + '">' + c + "</option>"; }).join("");
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("addTitle").value.trim(), u = $("addUrl").value.trim(), msg = $("addMsg");
    var ok = /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(u);
    if (!t || !ok) { msg.textContent = "Enter a title and a link that starts with https://www.youtube.com or https://youtu.be."; return; }
    state.mine.unshift({ id: "u" + Date.now(), title: t, sub: "Added by you", cat: $("addCat").value, level: "My link", url: u, custom: true });
    persist(); $("addForm").reset(); msg.textContent = "Added. Find it under " + state.mine[0].cat + ".";
    cat = "All"; renderAll();
  });

  renderAll();
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
</body>
</html>
